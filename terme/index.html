<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Klammer-Profi">
<title>Klammer-Profi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lexend:wght@400;500;700&display=swap">
<style>
/* Layout: eine Spalte wie ein Arbeitsheft; Lernpfad als Liste, Aufgabenkarte + Termtastatur unten */
:root{
  --bg:#f0f1f7; --surface:#ffffff; --fg:#1e2033; --muted:#5e6178; --line:#d9dbe8;
  --accent:#5847c9; --accent-soft:#e6e2fa; --second:#c9502f; --second-soft:#f8e0d7;
  --good:#22895a; --good-soft:#d8f0e4; --bad:#c2333b; --bad-soft:#f8dcdd; --warn:#a86a00; --warn-soft:#fbecc9; --gold:#c99a12;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Lexend", "Segoe UI", system-ui, sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15161f; --surface:#1f2130; --fg:#e9eaf3; --muted:#a0a3ba; --line:#34374b;
  --accent:#9b8cf5; --accent-soft:#2b2747; --second:#e57a58; --second-soft:#3b2620;
  --good:#4cc48a; --good-soft:#1c3529; --bad:#ef6b72; --bad-soft:#3d2125; --warn:#f0b543; --warn-soft:#3a2f17; --gold:#e8bd3c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15161f; --surface:#1f2130; --fg:#e9eaf3; --muted:#a0a3ba; --line:#34374b;
  --accent:#9b8cf5; --accent-soft:#2b2747; --second:#e57a58; --second-soft:#3b2620;
  --good:#4cc48a; --good-soft:#1c3529; --bad:#ef6b72; --bad-soft:#3d2125; --warn:#f0b543; --warn-soft:#3a2f17; --gold:#e8bd3c; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
.app{max-width:600px;margin:0 auto;padding-block:20px 32px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:2rem;font-weight:800;letter-spacing:-.01em}
h1 span{color:var(--accent)}
h2{font-size:1.5rem;font-weight:800}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
.sub{color:var(--muted);margin-top:4px}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.note{font-size:.85rem;color:var(--muted)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{font:700 1.1rem var(--body);padding:14px;border-radius:12px;border:0;background:var(--accent);color:#fff;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--line)}
.btn.small{width:auto;padding:8px 14px;font-size:.95rem}
.m{font-family:var(--display);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}

/* Tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}
.tab{border:0;border-radius:10px;background:transparent;color:var(--muted);padding:10px 4px;cursor:pointer;font:500 .85rem var(--body);display:flex;flex-direction:column;align-items:center;gap:2px}
.tab b{font:800 1.05rem var(--display);color:var(--fg)}
.tab[aria-pressed="true"]{background:var(--accent);color:#fff}
.tab[aria-pressed="true"] b{color:#fff}
.name{font:500 1.05rem var(--body);padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);width:100%}

/* Lernpfad */
.path{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.step .dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:800 1rem var(--display);flex:none;background:var(--accent-soft);color:var(--accent)}
.step.done .dot{background:var(--good);color:#fff}
.step.practice .dot{background:var(--second-soft);color:var(--second)}
.step.practice.done .dot{background:var(--good);color:#fff}
.step .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.step .txt small{color:var(--muted)}
.step .go{color:var(--muted);font-size:1.2rem}
.step.next{border:2px solid var(--accent)}

/* Stufen */
.stages{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chip{text-align:left;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.chip b{font:700 1rem var(--display)}
.chip small{color:var(--muted);font-size:.8rem}
.chip .ex{font-family:var(--display);font-weight:600;color:var(--fg)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.stages .chip:last-child:nth-child(odd){grid-column:1/-1}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--gold)}
.chip.ok .bar i{background:var(--good)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{text-align:left;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);cursor:pointer;display:flex;flex-direction:column;gap:4px}
.mode b{font-family:var(--display);font-size:1.05rem}
.mode small{color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--second);background:var(--second-soft)}

/* Kapitel */
.chapter{display:flex;flex-direction:column;gap:14px}
.chapter p{max-width:62ch}
.rule{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.rule .m{font-size:1.25rem;white-space:normal}
.tip{background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:.95rem}
.example{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.example .line{font-family:var(--display);font-weight:600;font-size:1.2rem;font-variant-numeric:tabular-nums}
.example .why{font-size:.85rem;color:var(--muted);margin-top:-2px}
.example .line.hide,.example .why.hide{display:none}
.example .ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.signs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.signs div{background:var(--bg);border-radius:10px;padding:8px;text-align:center;font-family:var(--display);font-weight:600}
.grid{display:inline-grid;gap:3px}
.grid i{width:22px;height:22px;border-radius:4px;background:var(--accent)}
.grid i.b{background:var(--second)}
.area{width:100%;max-width:360px;height:auto}
.area text{font-family:var(--display);font-weight:700;fill:var(--fg)}

/* Spiel */
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.hud .big{font:800 1.4rem var(--display)}
.streak{font-weight:700;color:var(--second)}
.track{height:14px;border-radius:7px;background:var(--second-soft);overflow:hidden}
.track i{display:block;height:100%;background:var(--second)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px 14px;text-align:center;display:flex;flex-direction:column;gap:8px;transition:background .15s,border-color .15s}
.card.ok{background:var(--good-soft);border-color:var(--good)}
.card.no{border-color:var(--bad)}
.card.almost{border-color:var(--warn)}
.prompt{color:var(--muted);font-weight:500}
.task{font:800 clamp(1.7rem,7.5vw,2.6rem) var(--display);font-variant-numeric:tabular-nums;line-height:1.2;overflow-wrap:anywhere}
.ansrow{display:flex;align-items:center;justify-content:center;gap:8px;font:700 clamp(1.5rem,6.5vw,2.2rem) var(--display);min-height:1.5em;overflow-wrap:anywhere}
.ansrow .eq{color:var(--muted)}
.answer{color:var(--accent);border-bottom:3px solid var(--line);min-width:3ch;padding:0 4px}
.answer::after{content:"";display:inline-block;width:3px;height:1em;background:var(--accent);margin-left:2px;vertical-align:-.12em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.fb{min-height:1.4em;font-weight:700}
.card.ok .fb{color:var(--good)} .card.no .fb{color:var(--bad)} .card.almost .fb{color:var(--warn)}
.sol{background:var(--bg);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.sol .line{font-family:var(--display);font-weight:600;font-size:1.1rem;overflow-wrap:anywhere}
.sol .why{font-size:.85rem;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;-webkit-user-select:none;user-select:none}
.pad button{font:700 1.45rem var(--display);padding:12px 0;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;touch-action:manipulation}
.pad button:active{transform:scale(.97)}
.pad .var{color:var(--accent);font-style:italic}
.pad .op{background:var(--bg)}
.pad .ok{background:var(--good);color:#fff;border-color:var(--good);font-size:1.1rem;grid-column:span 3}
.hintbtn{align-self:center;border:2px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;font:500 .95rem var(--body)}
.pad .del{font-size:1.1rem;color:var(--muted)}
.count{color:var(--second)}
.pop{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);font:800 1.5rem var(--display);color:var(--gold);pointer-events:none;animation:pop .8s forwards}
@keyframes pop{from{opacity:1;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(-50%,-140%)}}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--good);color:#fff;font:800 1.05rem var(--display);padding:10px 18px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:5;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){.pop,.answer::after{animation:none}}

/* Ergebnis / Nachweis */
.cert{border:3px double var(--gold);border-radius:14px;padding:18px 16px;text-align:center;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.cert h2{color:var(--gold)}
.cert .who{font:800 1.5rem var(--display)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats b{font:800 1.5rem var(--display);font-variant-numeric:tabular-nums}
.stars{font-size:2rem;letter-spacing:4px;color:var(--gold)}
.list{display:flex;flex-direction:column;gap:6px;text-align:left}
.list div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.list div:last-child{border-bottom:0}
.list .yes{color:var(--good);font-weight:700}
.list .no{color:var(--muted)}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ================= Speicher ================= */
const $ = s => document.querySelector(s);
const app = $('#app');
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem('klammerprofi2')||'{}') }catch(e){ return {} } },
  set(v){ try{ localStorage.setItem('klammerprofi2', JSON.stringify(v)) }catch(e){} }
};
let save = Object.assign({name:'', tab:'learn', done:{}, cnt:{}, best:{}, pts:0, solved:0, stage:{A:'A1',K:'K1'}, mode:{A:'train',K:'train'}}, store.get());
const persist = () => store.set(save);
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const gcd = (a,b) => { a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b] } return a };
const SICHER = 10;

/* ================= Polynome ================= */
// Ein Polynom ist eine Map: Schlüssel = Variablen mit Exponent ("x2", "a1b1", "" für Zahl), Wert = Koeffizient.
const parseKey = k => { const o={}; k.replace(/([a-z])(\d+)/g,(_,v,e)=>{ o[v]=+e }); return o };
const keyOf = o => Object.keys(o).filter(v=>o[v]>0).sort().map(v=>v+o[v]).join('');
const degOf = k => Object.values(parseKey(k)).reduce((a,b)=>a+b,0);
const P = {
  num(c){ return c ? new Map([['',c]]) : new Map() },
  v(x){ return new Map([[x+'1',1]]) },
  add(p,q,s=1){ const r=new Map(p); for(const [k,c] of q){ const n=(r.get(k)||0)+s*c; n ? r.set(k,n) : r.delete(k) } return r },
  mul(p,q){ const r=new Map(); for(const [k1,c1] of p) for(const [k2,c2] of q){ const v=parseKey(k1), w=parseKey(k2); for(const x in w) v[x]=(v[x]||0)+w[x]; const k=keyOf(v), n=(r.get(k)||0)+c1*c2; n ? r.set(k,n) : r.delete(k) } return r },
  eq(p,q){ if(p.size!==q.size) return false; for(const [k,c] of p) if(q.get(k)!==c) return false; return true }
};
const sortKeys = p => [...p.keys()].sort((a,b)=>degOf(b)-degOf(a) || (a===''?1:b===''?-1:a<b?-1:a>b?1:0));

/* ================= Eingabe lesen ================= */
function tokenize(s){
  s = s.replace(/−/g,'-').replace(/[·*×]/g,'*').replace(/\s+/g,'').toLowerCase();
  const out=[]; let i=0;
  while(i<s.length){
    const c=s[i];
    if(/\d/.test(c)){ let j=i; while(j<s.length && /\d/.test(s[j])) j++; out.push({t:'num',v:+s.slice(i,j)}); i=j; continue }
    if(/[a-z]/.test(c)){ out.push({t:'var',v:c}); i++; continue }
    if(c==='²'){ out.push({t:'pow',v:2}); i++; continue }
    if(c==='³'){ out.push({t:'pow',v:3}); i++; continue }
    if(c==='^'){ const m=s.slice(i+1).match(/^\d/); if(!m) throw 'pow'; out.push({t:'pow',v:+m[0]}); i+=2; continue }
    if('+-*()'.includes(c)){ out.push({t:c}); i++; continue }
    throw 'zeichen';
  }
  return out;
}
function parse(s){
  const tk=tokenize(s); let i=0;
  const peek=()=>tk[i], eat=t=>{ if(tk[i] && tk[i].t===t){ i++; return true } return false };
  function sum(){
    const terms=[]; let sign=1;
    if(eat('-')) sign=-1; else eat('+');
    terms.push({sign, factors:product()});
    while(peek() && (peek().t==='+'||peek().t==='-')){ const sg = tk[i++].t==='-' ? -1 : 1; terms.push({sign:sg, factors:product()}) }
    return {type:'sum', terms};
  }
  function product(){
    const f=[atom()];
    while(peek() && (peek().t==='*' || ['num','var','('].includes(peek().t))){ eat('*'); f.push(atom()) }
    return f;
  }
  function atom(){
    const t=tk[i]; if(!t) throw 'ende';
    let node;
    if(t.t==='num'){ i++; node={type:'num',v:t.v} }
    else if(t.t==='var'){ i++; node={type:'var',v:t.v} }
    else if(t.t==='('){ i++; node={type:'group', e:sum()}; if(!eat(')')) throw 'klammer' }
    else if(t.t==='-'){ i++; node={type:'neg', a:atom()} }
    else throw 'unerwartet';
    while(peek() && peek().t==='pow') node={type:'pow', a:node, n:tk[i++].v};
    return node;
  }
  const r=sum(); if(i<tk.length) throw 'rest'; return r;
}
function polyOf(n){
  switch(n.type){
    case 'num': return P.num(n.v);
    case 'var': return P.v(n.v);
    case 'group': return polyOf(n.e);
    case 'neg': return P.mul(P.num(-1), polyOf(n.a));
    case 'pow': { let r=P.num(1); for(let k=0;k<n.n;k++) r=P.mul(r, polyOf(n.a)); return r }
    case 'sum': { let r=new Map(); for(const t of n.terms){ let p=P.num(t.sign); for(const f of t.factors) p=P.mul(p, polyOf(f)); r=P.add(r,p) } return r }
  }
}
const termPoly = t => { let p=P.num(t.sign); t.factors.forEach(f=>{ p=P.mul(p, polyOf(f)) }); return p };

/* ================= Schreiben ================= */
function varStr(k){ const o=parseKey(k); return Object.keys(o).sort().map(v=>v+(o[v]===1?'':o[v]===2?'²':o[v]===3?'³':'^'+o[v])).join('') }
function monoStr(c,k,first){
  const vs=varStr(k), a=Math.abs(c);
  const body = (a===1 && vs) ? vs : a+vs;
  return (c<0 ? '-' : (first?'':'+')) + body;
}
function polyStr(p){ const ks=sortKeys(p); return ks.length ? ks.map((k,i)=>monoStr(p.get(k),k,i===0)).join('') : '0' }
function pretty(s){
  let o='';
  for(let i=0;i<s.length;i++){
    const c=s[i], p=s[i-1];
    if(c==='+'){ o+=' + '; continue }
    if(c==='-'){ o += (i>0 && /[0-9a-z)²³]/.test(p)) ? ' − ' : '−'; continue }
    if(c==='*'){ o+=' · '; continue }
    o+=c;
  }
  return o;
}
const fac = p => { if(!p.size) return '0'; const s=pretty(polyStr(p)); return s.startsWith('−') ? `(${s})` : s };
const live = s => s.replace(/-/g,'−').replace(/\*/g,'·');

/* ================= Rechenweg ================= */
function stepsExp(src){
  const ast=parse(src), l1=[], parts=[];
  ast.terms.forEach(t=>{
    const groups=t.factors.filter(f=>f.type==='group'), rest=t.factors.filter(f=>f.type!=='group');
    let outer=P.num(t.sign); rest.forEach(f=>{ outer=P.mul(outer, polyOf(f)) });
    if(groups.length===1){
      const inner=groups[0].e.terms.map(termPoly);
      l1.push(inner.map(ip=>`${fac(outer)} · ${fac(ip)}`).join(' + '));
      inner.forEach(ip=>parts.push(P.mul(outer,ip)));
    } else { l1.push(fac(outer)); parts.push(outer) }
  });
  const line2 = pretty(parts.map((p,i)=>{ const k=[...p.keys()][0]; return k===undefined ? (i?'+0':'0') : monoStr(p.get(k),k,i===0) }).join(''));
  const total = parts.reduce((a,p)=>P.add(a,p), new Map());
  const out=[{line:l1.join(' + '), why:'Jeden Summanden in der Klammer mit dem Faktor davor malnehmen'}, {line:line2, why:'Ausrechnen'}];
  const fin = pretty(polyStr(total));
  if(fin!==line2) out.push({line:fin, why:'Gleiche Terme zusammenfassen'});
  return out;
}
function factorize(p){
  const ks=sortKeys(p);
  let g=ks.reduce((a,k)=>gcd(a,p.get(k)),0);
  if(p.get(ks[0])<0) g=-g;
  const vars=new Set(ks.flatMap(k=>Object.keys(parseKey(k)))), common={};
  vars.forEach(v=>{ common[v]=Math.min(...ks.map(k=>parseKey(k)[v]||0)) });
  const ok=keyOf(common), outer=new Map([[ok,g]]), inner=new Map();
  ks.forEach(k=>{ const o=parseKey(k); for(const v in common) o[v]-=common[v]; inner.set(keyOf(o), p.get(k)/g) });
  return {g, ok, outer, inner};
}
function factorStr(f){
  const o = f.ok==='' && f.g===-1 ? '-' : f.ok==='' && f.g===1 ? '' : polyStr(f.outer);
  return pretty(`${o}(${polyStr(f.inner)})`);
}
function stepsFac(p){
  const f=factorize(p), ks=sortKeys(p), out=[];
  const nums=ks.map(k=>Math.abs(p.get(k)));
  if(Math.abs(f.g)>1) out.push({line:`Gemeinsame Zahl: ${Math.abs(f.g)}`, why:`${nums.join(' und ')} kann man beide durch ${Math.abs(f.g)} teilen`});
  else out.push({line:`Die Zahlen ${nums.join(', ')} haben keinen gemeinsamen Teiler.`, why:''});
  if(f.ok) out.push({line:`Jeder Summand enthält ${varStr(f.ok)}`, why:`Gemeinsamer Faktor: ${pretty(polyStr(new Map([[f.ok,Math.abs(f.g)]])))}`});
  if(f.g<0) out.push({line:`Erster Summand negativ: ${pretty(polyStr(f.outer))} ausklammern`, why:'Dann drehen sich die Vorzeichen in der Klammer um'});
  const div = pretty(polyStr(new Map([[f.ok,Math.abs(f.g)]])));
  out.push({line: ks.map(k=>{
    const o=parseKey(k); for(const v in parseKey(f.ok)) o[v]-=parseKey(f.ok)[v]; const ik=keyOf(o);
    return `${pretty(polyStr(new Map([[k,Math.abs(p.get(k))]])))} : ${div} = ${pretty(polyStr(new Map([[ik,Math.abs(f.inner.get(ik))]])))}`;
  }).join('  und  '), why:'Beide Teile durch diese Zahl teilen'});
  out.push({line:`= ${factorStr(f)}`, why:`Die ${div} kommt vor die Klammer, der Rest hinein${ks.some(k=>p.get(k)<0)?'. Das Minus bleibt stehen':''}`});
  return out;
}

/* ================= Antwort prüfen ================= */
function simpleTerm(t){
  let nums=0; const seen=new Set();
  for(const f0 of t.factors){
    const b = f0.type==='pow' ? f0.a : f0;
    if(b.type==='num') nums++;
    else if(b.type==='var'){ if(seen.has(b.v)) return false; seen.add(b.v) }
    else return false;
  }
  return nums<=1;
}
function check(task, input){
  let ast; try{ ast=parse(input) }catch(e){ return {state:'parse'} }
  const p=polyOf(ast), eq=P.eq(p, task.target);
  if(task.kind==='exp'){
    if(input.includes('(')) return eq ? {state:'almost', msg:'Fast! In deiner Antwort steht noch eine Klammer. Löse sie ganz auf.'} : {state:'wrong'};
    if(!eq) return {state:'wrong'};
    if(!ast.terms.every(simpleTerm)) return {state:'almost', msg:'Richtig gerechnet! Vereinfache noch, zum Beispiel 3 · 4 = 12.'};
    const keys=ast.terms.map(t=>{ const q=termPoly(t); return q.size ? [...q.keys()][0] : '#0' });
    if(new Set(keys).size<keys.length) return {state:'almost', msg:'Richtig gerechnet! Fasse jetzt noch gleiche Terme zusammen.'};
    return {state:'ok'};
  }
  if(!eq) return {state:'wrong'};
  const gs = ast.terms.length===1 ? ast.terms[0].factors.filter(f=>f.type==='group') : [];
  if(gs.length!==1 || polyOf(gs[0]).size<2) return {state:'almost', msg:'Das ist gleich viel, aber noch nicht ausgeklammert. Schreibe den gemeinsamen Faktor vor eine Klammer.'};
  const rest = factorize(polyOf(gs[0]));
  if(Math.abs(rest.g)>1 || rest.ok) return {state:'almost', msg:`Gut! Aber in der Klammer steckt noch der Faktor ${pretty(polyStr(new Map([[rest.ok,Math.abs(rest.g)]])))}. Klammere ihn auch aus.`};
  return {state:'ok'};
}

/* ================= Aufgaben erzeugen ================= */
const V = () => 'x';
const ms = (c,v) => c===1&&v ? v : c===-1&&v ? '-'+v : c+v;
const sumStr = arr => arr.map(([c,v],i)=>{ const s=ms(c,v); return i>0 && c>0 ? '+'+s : s }).join('');
const pm = () => pick([1,-1]);
// Zwischenschritt: Aus k·(a+b) werden die Paare (k,a) und (k,b) erwartet
function makeMulti(t){
  const term=parse(t.src).terms[0];
  t.k = term.factors.find(f=>f.type==='num').v;
  t.pairs = term.factors.find(f=>f.type==='group').e.terms.map(it=>({n:it.factors[0].v, s:it.sign}));
  t.multi = true;
}
function checkDist(t, input){
  let ast; try{ ast=parse(input) }catch(e){ return {state:'parse'} }
  const same = P.eq(polyOf(ast), t.target);
  const shape = ast.terms.length===t.pairs.length && ast.terms.every(tm=>tm.factors.length===2 && tm.factors.every(f=>f.type==='num'));
  if(!shape) return same ? {state:'almost', msg:`Schreib zuerst den Zwischenschritt mit Malpunkten auf: ${t.k} · … + ${t.k} · …`} : {state:'wrong'};
  const left=[...t.pairs];
  for(const tm of ast.terms){
    const [a,b]=[tm.factors[0].v, tm.factors[1].v];
    const i=left.findIndex(p=>p.s===tm.sign && ((a===t.k && b===p.n) || (b===t.k && a===p.n)));
    if(i<0) return same ? {state:'almost', msg:`Nimm die ${t.k} mit jeder Zahl in der Klammer mal.`} : {state:'wrong'};
    left.splice(i,1);
  }
  return {state:'ok'};
}
function makeTask(kind, src, prompt){
  const target = polyOf(parse(src));
  return {kind, src, target, show:pretty(src), prompt: prompt || (kind==='exp' ? 'Löse die Klammer auf:' : 'Klammere aus:')};
}
function genA(stage){
  const k=rnd(2,5), b=rnd(1,9), m = Math.random()<.75 ? 1 : 2;
  if(stage==='A1'){
    const inner = Math.random()<.8 ? [[m,'x'],[b,'']] : [[b,''],[m,'x']];
    return makeTask('exp', `${k}(${sumStr(inner)})`);
  }
  if(stage==='A2'){
    const w=rnd(0,3);
    if(w<=1) return makeTask('exp', `${k}(${sumStr([[m,'x'],[-b,'']])})`);
    if(w===2) return makeTask('exp', `-(x+${b})`);
    return makeTask('exp', `-(x-${b})`);
  }
  // A3: auflösen und zusammenfassen, nur mit Plus zwischen den Teilen
  const w=rnd(0,2), c=rnd(1,9), mm=rnd(1,4), k2=rnd(2,4), b2=rnd(1,5);
  const src = w===0 ? `${k}(x+${b})+${c}` : w===1 ? `${k}(x+${b})+${ms(mm,'x')}` : `${k}(x+${rnd(1,5)})+${k2}(x+${b2})`;
  return makeTask('exp', src, 'Löse auf und fasse zusammen:');
}
function coprimePair(maxM=6){ let m,n; do{ m=rnd(1,maxM); n=rnd(1,9) } while(gcd(m,n)!==1); return [m,n] }
function facFrom(outer, inner){ const p=polyOf(parse(`${outer}(${inner})`)); return makeTask('fac', polyStr(p)) }
function genK(stage){
  const g=rnd(2,5), n=rnd(1,9);
  if(stage==='K1') return facFrom(String(g), `x+${n}`);
  const w=rnd(0,2);
  if(w===0) return facFrom(String(g), `x-${n}`);
  let m, nn; do{ m=pick([2,3]); nn=rnd(1,9) } while(gcd(m,nn)!==1);
  return facFrom(String(g), sumStr([[m,'x'],[pm()*nn,'']]));
}

      <div id="doneLines"></div>
      <div class="ansrow"><span class="eq">=</span><span class="answer" id="ans"></span></div>
      <div class="fb" id="fb" role="status"></div>
      ${G.type!=='sprint'?'<button class="hintbtn" id="hint">💡 Tipp: erster Schritt</button>':''}
      <div id="help"></div>
    </div>
    <div class="pad" id="pad">${KEYS.map(k=>`<button data-k="${k}" class="${/^[xab]$/.test(k)?'var':'+-()²*'.includes(k)?'op':k==='ok'?'ok':k==='del'?'del':''}" aria-label="${k==='del'?'Löschen':k==='-'?'Minus':k==='²'?'hoch 2':k==='*'?'mal':k}">${keyLabel(k)}</button>`).join('')}</div>
    <p class="note">Den Malpunkt · brauchst du zwischen zwei Zahlen, zum Beispiel 5 · 10. Bei x nicht: 3x heißt 3 · x.</p>`;
  app.querySelectorAll('#pad button').forEach(b=>b.onclick=()=>key(b.dataset.k));
  const hb=$('#hint'); if(hb) hb.onclick=showHint;
  $('#quit').onclick=()=>{ stopGame(); G.type==='tut' ? chapter(G.chapter) : home() };
  window.scrollTo(0,0);
  if(G.type!=='sprint'){ next(); return }
  G.locked=true; let n=3;
  $('#q').innerHTML=`<span class="count">3</span>`; $('#fb').textContent='Mach dich bereit …';
  const step=()=>{ if(!G) return; n--; if(n>0){ $('#q').innerHTML=`<span class="count">${n}</span>`; cd=setTimeout(step,800); return } next(); runClock() };
  cd=setTimeout(step,800);
}
function stopGame(){ clearInterval(tick); clearTimeout(cd); }
function runClock(){
  const t0=performance.now();
  tick=setInterval(()=>{
    if(!G) return;
    G.left=Math.max(0, G.total-(performance.now()-t0)/1000);
    $('#tbar').style.width=(G.left/G.total*100)+'%';
    if(G.left<=0) end();
  },100);
}
function next(){
  let t;
  if(G.type==='tut') t=G.list[G.count];
  else { let tries=0; do{ t=BEREICH[G.bereich].gen(G.stage); tries++ } while(t.src===G.last && tries<8) }
  G.cur=t; G.last=t.src; G.input=''; G.locked=false; G.count++;
  $('#prompt').textContent=t.prompt; $('#q').textContent=t.show;
  $('#ans').textContent=''; $('#fb').textContent=''; $('#help').innerHTML=''; $('#card').className='card';
  $('#doneLines').innerHTML=''; G.sub=0;
  const hb=$('#hint'); if(hb) hb.hidden=false;
  if(G.type!=='sprint') $('#prog').textContent = G.type==='tut' ? `Kapitel ${G.chapter+1} · Aufgabe ${G.count} von ${G.max}` : `${G.stage} · Aufgabe ${G.count} von ${G.max}`;
}
function key(k){
  if(!G || G.locked) return;
  if(k==='del') G.input=G.input.slice(0,-1);
  else if(k==='ok'){ if(G.input.trim()) submit(); return }
  else if(G.input.length<40) G.input+=k;
  $('#ans').textContent=live(G.input);
  if($('#card').classList.contains('almost')){ $('#card').className='card'; $('#fb').textContent='' }
}
function showHint(){
  if(!G || !G.cur || G.cur.retry) return;
  const t=G.cur; t.hinted=true;
  if(t.multi){
    const nums=t.pairs.map(p=>p.n);
    const txt = G.sub===0 ? `Nimm die ${t.k} mit der ${nums[0]} mal und die ${t.k} mit der ${nums[1]} mal. Schreib beides mit Malpunkt auf.`
                          : `Rechne jedes Malzeichen einzeln aus. Dann ${t.pairs[1].s<0?'subtrahiere':'addiere'} die Ergebnisse.`;
    $('#help').innerHTML = `<div class="sol"><span class="label">Tipp</span><span class="why" style="font-size:1rem;color:var(--fg)">${txt}</span></div>`;
    $('#hint').hidden=true; return;
  }
  const first = t.kind==='exp' ? '= '+stepsExp(t.src)[0].line : stepsFac(t.target)[0].line;
  const why = t.kind==='exp' ? 'Jetzt jeden Teil ausrechnen.' : stepsFac(t.target)[0].why;
  $('#help').innerHTML = `<div class="sol"><span class="label">Tipp</span><span class="line">${first}</span>${why?`<span class="why">${why}</span>`:''}</div>`;
  $('#hint').hidden=true;
}
function solutionHTML(t){
  const steps = t.kind==='exp' ? stepsExp(t.src) : stepsFac(t.target);
  return `<div class="sol"><span class="label">So geht's</span><span class="line">${t.show}</span>${steps.map(s=>`<span class="line">${t.kind==='exp'?'= ':''}${s.line}</span>${s.why?`<span class="why">${s.why}</span>`:''}`).join('')}</div>`;
}
function submit(){
  const t=G.cur;
  if(t.multi && G.sub===0){
    const d=checkDist(t, G.input);
    if(d.state==='parse'){ $('#card').className='card almost'; $('#fb').textContent='Das kann ich nicht lesen. Prüfe die Rechenzeichen.'; return }
    if(d.state==='almost'){ $('#card').className='card almost'; $('#fb').textContent=d.msg; return }
    if(d.state==='ok'){
      $('#doneLines').innerHTML = `<div class="ansrow"><span class="eq">=</span><span>${pretty(G.input.replace(/·/g,'*'))}</span></div>`;
      G.sub=1; G.input=''; $('#ans').textContent=''; $('#help').innerHTML='';
      $('#card').className='card'; $('#fb').textContent='Gut! Jetzt rechne aus:';
      const hb=$('#hint'); if(hb && !t.retry) hb.hidden=false;
      return;
    }
    if(!t.retry){ G.wrong++; G.streak=0; G.misses.push(`${t.show} = ${stepsExp(t.src)[0].line} = ${pretty(polyStr(t.target))}`) }
    t.retry=true; G.input=''; $('#ans').textContent='';
    $('#card').className='card no'; $('#fb').textContent='Noch nicht. Schau dir den Rechenweg an und schreib dann den Zwischenschritt auf.';
    $('#help').innerHTML=solutionHTML(t); const hb=$('#hint'); if(hb) hb.hidden=true;
    $('#score').textContent=G.score; $('#streak').textContent='';
    return;
  }
  const r=check(t, G.input);
  if(r.state==='parse'){ $('#card').className='card almost'; $('#fb').textContent='Das kann ich nicht lesen. Prüfe Klammern und Rechenzeichen.'; return }
  if(r.state==='almost'){ $('#card').className='card almost'; $('#fb').textContent=r.msg; return }
  G.locked=true;
  if(r.state==='ok'){
    if(t.retry){ $('#card').className='card ok'; $('#fb').textContent='Genau, jetzt stimmt es!'; return later(1200) }
    G.correct++; G.streak++; G.bestStreak=Math.max(G.bestStreak,G.streak); save.solved=(save.solved||0)+1;
    const pts = t.hinted ? 5 : 10 + (G.streak>=3?5:0); G.score+=pts; popup('+'+pts);
    if(G.type!=='tut' && !t.hinted){
      const before=cntOf(G.stage); save.cnt[G.stage]=before+1;
      if(before+1===SICHER) toast(`Stufe ${G.stage} geschafft ✓`);
    }
    persist();
    $('#card').className='card ok'; $('#fb').textContent = t.hinted ? 'Richtig! Probier die nächste ohne Tipp.' : pick(['Richtig!','Super!','Stark gerechnet!','Genau so!']);
    later(G.type==='sprint'?500:900);
  } else {
    G.wrong++; G.streak=0; G.misses.push(`${t.show} = ${t.kind==='exp'?pretty(polyStr(t.target)):factorStr(factorize(t.target))}`);
    $('#card').className='card no';
    $('#help').innerHTML=solutionHTML(t);
    if(G.type==='sprint'){ $('#fb').textContent='Leider falsch.'; return later(3000) }
    $('#fb').textContent='Noch nicht. Schau dir den Rechenweg an und tippe dann die Lösung ein.';
    t.retry=true; G.input=''; $('#ans').textContent=''; G.locked=false; const hb=$('#hint'); if(hb) hb.hidden=true;
  }
  $('#score').textContent=G.score;
  $('#streak').textContent = G.streak>=3 ? `🔥 ${G.streak} in Folge` : '';
}
function later(ms){
  $('#score').textContent=G.score;
  $('#streak').textContent = G.streak>=3 ? `🔥 ${G.streak} in Folge` : '';
  setTimeout(()=>{ if(!G) return; if(G.type==='sprint'){ if(G.left>0) next(); return } if(G.count>=G.max) return end(); next() }, ms);
}
function popup(t){ const p=document.createElement('div'); p.className='pop'; p.textContent=t; document.body.appendChild(p); setTimeout(()=>p.remove(),800) }
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600) }
document.addEventListener('keydown',e=>{
  if(!G || !$('#ans') || e.target.tagName==='INPUT') return;
  const k=e.key;
  if(/^[0-9]$/.test(k) || /^x$/i.test(k) || '+-()*'.includes(k)) { key(k.toLowerCase()); e.preventDefault() }
  else if(k==='Backspace'){ key('del'); e.preventDefault() }
  else if(k==='Enter') key('ok');
});

/* ================= Ergebnis ================= */
function end(){
  stopGame();
  const g=G; G=null;
  const total=g.correct+g.wrong, quote= total ? g.correct/total : 0;
  const stars=(quote>=.6?1:0)+(quote>=.8?1:0)+(quote>=.95?1:0);
  let rec=false, chapterDone=false;
  if(g.type==='sprint' && g.correct>(save.best[g.stage]||0)){ save.best[g.stage]=g.correct; rec=true }
  if(g.type==='tut' && !save.done[g.chapter]){ save.done[g.chapter]=true; chapterDone=true }
  save.pts=(save.pts||0)+g.score; persist();
  const title = g.type==='tut' ? `Kapitel ${g.chapter+1}: ${CHAPTERS[g.chapter].title}` : `${g.stage} ${stageOf(g.stage).name} · ${g.type==='sprint'?'Minutentest':'Üben'}`;
  const nextBtn = g.type==='tut'
    ? (g.chapter===4 ? `<button class="btn" id="toA">Jetzt Auflösen üben</button>` : g.chapter+1<CHAPTERS.length ? `<button class="btn" id="nextch">Weiter zu Kapitel ${g.chapter+2}</button>` : `<button class="btn" id="toK">Jetzt Ausklammern üben</button>`)
    : `<button class="btn" id="again">Nochmal</button>`;
  app.innerHTML = `
    <section class="cert">
      <span class="label">${g.type==='tut'?'Kapitel geschafft':'Ergebnis'}</span>
      <h2>${esc(title)}</h2>
      <div class="who">${esc(save.name||'Ohne Namen')}</div>
      <div>hat <b>${g.correct} von ${total}</b> Aufgaben auf Anhieb richtig gelöst${g.type==='sprint'?' – in 60 Sekunden':''}.</div>
      <div class="stars" aria-label="${stars} von 3 Sternen">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
      <div class="note">${new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}, ${new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} Uhr</div>
      ${rec?'<div><b style="color:var(--gold)">Neuer Rekord!</b></div>':''}
      ${chapterDone && g.chapter===4 ? '<div class="note">Übe jetzt im Bereich „Auflösen“, bevor du mit Kapitel 6 weitermachst.</div>':''}
    </section>
    ${g.misses.length?`<section class="panel"><span class="label">Diese Aufgaben solltest du dir nochmal ansehen</span><div class="list">${[...new Set(g.misses)].map(m=>`<div><span class="m">${m}</span></div>`).join('')}</div></section>`:''}
    ${nextBtn}
    <button class="btn ghost" id="back">Zur Übersicht</button>`;
  $('#back').onclick=home;
  const a=$('#again'); if(a) a.onclick=()=>startGame({type:g.type, bereich:g.bereich, stage:g.stage});
  const nc=$('#nextch'); if(nc) nc.onclick=()=>chapter(g.chapter+1);
  const ta=$('#toA'); if(ta) ta.onclick=()=>{ save.tab='A'; save.mode.A='train'; persist(); home() };
  const tk=$('#toK'); if(tk) tk.onclick=()=>{ save.tab='K'; save.mode.K='train'; persist(); home() };
  window.scrollTo(0,0);
}

/* ================= Nachweis ================= */
function proof(){
  const d=new Date();
  app.innerHTML = `
    <section class="cert">
      <span class="label">Nachweis · Klammer-Profi</span>
      <div class="who">${esc(save.name||'Bitte Vornamen eintragen')}</div>
      <div class="note">Stand: ${d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}, ${d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} Uhr</div>
      <div class="stats"><div><span class="label">Kapitel</span><b>${Object.keys(save.done).length}/${CHAPTERS.length}</b></div><div><span class="label">Stufen</span><b>${sicherIn('A')+sicherIn('K')}/${allStages().length}</b></div><div><span class="label">Gelöst</span><b>${save.solved||0}</b></div></div>
      <span class="label" style="margin-top:6px">Kapitel</span>
      <div class="list">${CHAPTERS.map((c,i)=>`<div><span>${i+1}. ${c.title}</span><span class="${save.done[i]?'yes':'no'}">${save.done[i]?'✓':'–'}</span></div>`).join('')}</div>
      <span class="label" style="margin-top:6px">Stufen · richtig gelöst · Rekord Minutentest</span>
      <div class="list">${allStages().map(s=>`<div><span>${s.id} ${s.name}</span><span class="${cntOf(s.id)>=SICHER?'yes':'no'}">${cntOf(s.id)}${cntOf(s.id)>=SICHER?' ✓':''} · ${save.best[s.id]||0}</span></div>`).join('')}</div>
    </section>
    <p class="note">Mach einen Screenshot von diesem Nachweis und gib ihn deiner Lehrkraft.</p>
    <button class="btn" id="back">Zurück</button>`;
  $('#back').onclick=home;
  window.scrollTo(0,0);
}

home();
</script>
</body>
</html>
